name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP syntax check
        run: find . \( -path ./vendor -o -path ./node_modules \) -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: PHPCS
        run: composer run phpcs

  validate:
    name: Validate theme files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          fail=0
          for f in theme.json blocks/*/block.json; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Expected JSON file is missing"
              fail=1
              continue
            fi
            if jq empty "$f" 2>/tmp/jqerr; then
              echo "OK   $f"
            else
              echo "::error file=$f::Invalid JSON — $(cat /tmp/jqerr)"
              fail=1
            fi
          done
          exit $fail

      - name: Template parts present
        run: |
          fail=0
          for part in parts/header.html parts/footer.html; do
            if [ -f "$part" ]; then
              echo "OK   $part"
            else
              echo "::error file=$part::Required template part is missing (see the parts/ gitignore trap)"
              fail=1
            fi
          done
          exit $fail

      - name: Version and changelog consistency
        run: |
          version=$(grep -m1 -E '^Version:' style.css | sed -E 's/^Version:[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error file=style.css::Could not read Version header"
            exit 1
          fi
          echo "style.css Version: $version"
          if grep -qE "^## \[$(printf '%s' "$version" | sed 's/\./\\./g')\]" CHANGELOG.md; then
            echo "OK   CHANGELOG.md has an entry for $version"
          else
            echo "::error file=CHANGELOG.md::No '## [$version]' section for the current style.css version"
            exit 1
          fi

  theme-check:
    name: WordPress Theme Check
    runs-on: ubuntu-latest
    # Report-only for now: Theme Check emits INFO/RECOMMENDED notices that should
    # not hard-block merges. Promote to a required check once the output is clean.
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out theme
        uses: actions/checkout@v4
        with:
          path: oaf-wp-blocktheme

      - name: Set up PHP + WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: wp-cli
          coverage: none

      - name: Install WordPress
        run: |
          wp core download --path=wp --version=latest
          wp config create --path=wp \
            --dbname=wordpress --dbuser=root --dbpass=root \
            --dbhost=127.0.0.1:3306
          wp core install --path=wp \
            --url=http://localhost --title="Theme Check" \
            --admin_user=admin --admin_password=admin \
            --admin_email=ci@example.com --skip-email

      - name: Install theme under test
        run: |
          # Copy only what ships in the theme; dev-only dirs would add noise.
          dest=wp/wp-content/themes/oaf-wp-blocktheme
          mkdir -p "$dest"
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='vendor' \
            --exclude='node_modules' --exclude='.playwright-mcp' \
            oaf-wp-blocktheme/ "$dest/"

      - name: Run Theme Check
        run: |
          # Drive the official Theme Check plugin via its run_themechecks() API
          # (avoids `wp package install`, whose Composer VCS auth fails on runners).
          # The check logic lives in bin/theme-check.php so CI and the local
          # `mise run theme-check` task run identical checks.
          wp plugin install theme-check --path=wp
          wp eval-file oaf-wp-blocktheme/bin/theme-check.php --path=wp
