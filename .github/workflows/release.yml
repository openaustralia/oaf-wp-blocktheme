name: Release

# Runs only on pushes to main (never pull_request), so fork PRs never see the
# Git Updater deploy secret.
on:
  push:
    branches: [ main ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and release on version bump
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: check
        run: |
          version=$(grep -m1 -E '^Version:' style.css | sed -E 's/^Version:[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error file=style.css::Could not read Version header"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists — no release this push."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $version — will release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog notes
        if: steps.check.outputs.released == 'true'
        run: |
          version="${{ steps.check.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Trim leading/trailing blank lines
          sed -i -e '/./,$!d' release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section found for release notes"
            exit 1
          fi
          echo "----- release notes for v$version -----"
          cat release-notes.md

      - name: Create tag and GitHub release
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.check.outputs.version }}"
          gh release create "v$version" \
            --title "v$version" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

  deploy:
    name: Install on production via Git Updater
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    env:
      SLUG: oaf-wp-blocktheme
      VERSION: ${{ needs.release.outputs.version }}
      WP_SITE_URL: ${{ vars.WP_SITE_URL }}
      GU_REST_KEY: ${{ secrets.GU_REST_KEY }}
    steps:
      - name: Flush Git Updater cache
        run: |
          curl -fsS -X POST \
            "$WP_SITE_URL/wp-json/git-updater/v1/flush-repo-cache?key=$GU_REST_KEY&slug=$SLUG" \
            | tee flush.json
          echo

      - name: Trigger update
        run: |
          # NB: production currently has Git Updater tracking the `main` branch.
          # If adding GitHub Releases flips it to prefer the latest tag, change
          # `branch=main` to `tag=v$VERSION` (the installed code is identical
          # either way — this only controls which ref GU sees as updatable).
          curl -fsS -X POST \
            "$WP_SITE_URL/wp-json/git-updater/v1/update?key=$GU_REST_KEY&theme=$SLUG&branch=main" \
            | tee update.json
          echo
          if grep -qi '"error"\|"success":false' update.json; then
            echo "::error::Git Updater reported an error during update"
            exit 1
          fi

      - name: Verify installed version
        run: |
          curl -fsS \
            "$WP_SITE_URL/wp-json/git-updater/v1/repos?key=$GU_REST_KEY" \
            | tee repos.json
          echo
          # The exact field names in the repos response must be confirmed against
          # the live endpoint (see the plan). We search broadly for any version
          # value associated with the theme slug rather than hard-coding a path.
          installed=$(jq -r --arg slug "$SLUG" '
            [.. | objects | to_entries[]
              | select(.key | test("version"; "i"))
              | .value | strings | select(test("^[0-9]"))] | first // empty
          ' repos.json 2>/dev/null || true)
          echo "Reported version for $SLUG: ${installed:-<unparsed>}"
          if [ -z "$installed" ]; then
            echo "::warning::Could not parse a version from the repos response; " \
                 "confirm the field names and tighten this check. Deploy call itself succeeded."
          elif [ "$installed" != "$VERSION" ]; then
            echo "::error::Production reports '$installed' but expected $VERSION"
            exit 1
          else
            echo "Production is on $VERSION."
          fi
