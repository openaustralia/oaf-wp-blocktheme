name: Changelog

on:
  pull_request:

jobs:
  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    # Skip when the PR is labelled 'no-changelog' (internal-only changes).
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error::This PR does not update CHANGELOG.md. Add an entry under [Unreleased], or apply the 'no-changelog' label if the change is internal-only. See CONTRIBUTING.md."
            exit 1
          fi
